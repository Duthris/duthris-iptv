name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches the package version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $pkg" >&2
            exit 1
          fi

      - name: Build renderer
        run: pnpm -w run build:renderer
        env:
          NEXT_PUBLIC_TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          NEXT_PUBLIC_OPENSUBTITLES_KEY: ${{ secrets.OPENSUBTITLES_KEY }}

      - name: Build main process
        run: pnpm --filter @iptv/desktop run build:main

      - name: Package and publish
        run: pnpm --filter @iptv/desktop exec electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
